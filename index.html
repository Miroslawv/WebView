<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Погода сегодня</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <h1>Погода</h1>
    <nav class="nav">
        <a href="index.html">Сегодня</a>
        <a href="forecast.html">Прогноз</a>
        <a href="cities.html">Города</a>
    </nav>
</header>
<main>
    <section class="weather">
        <h2>Минск</h2>
        <div class="weather-icon">☀️</div>
        <p class="temperature">+24°C</p>
        <p class="description">Солнечно</p>
        <div class="weather-info">
            <div class="info-item">
                <p>💧</p>
                <span>Влажность</span>
                <strong>45%</strong>
            </div>
            <div class="info-item">
                <p>💨</p>
                <span>Ветер</span>
                <strong>3 м/с</strong>
            </div>
            <div class="info-item">
                <p>🌡️</p>
                <span>Давление</span>
                <strong>760 мм</strong>
            </div>
        </div>
    </section>
</main>
<footer class="footer">
    <p>Погода на сегодня</p>
</footer>

</body>
</html>
