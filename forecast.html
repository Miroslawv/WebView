<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прогноз погоды</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <h1>Погода</h1>
    <nav class="nav">
        <a href="index.html">Сегодня</a>
        <a href="forecast.html">Прогноз</a>
        <a href="cities.html">Города</a>
    </nav>
</header>
<main>
    <section class="forecast">
        <h2>Прогноз на 5 дней</h2>
        <div class="days">
            <article class="day">
                <h3>Понедельник</h3>
                <div class="weather-icon">☀️</div>
                <p class="day-temperature">+24°C</p>
                <p>Солнечно</p>
            </article>
            <article class="day">
                <h3>Вторник</h3>
                <div class="weather-icon">🌤️</div>
                <p class="day-temperature">+22°C</p>
                <p>Облачно</p>
            </article>
            <article class="day">
                <h3>Среда</h3>
                <div class="weather-icon">🌧️</div>
                <p class="day-temperature">+18°C</p>
                <p>Дождь</p>
            </article>
            <article class="day">
                <h3>Четверг</h3>
                <div class="weather-icon">☁️</div>
                <p class="day-temperature">+20°C</p>
                <p>Облачно</p>
            </article>
            <article class="day">
                <h3>Пятница</h3>
                <div class="weather-icon">☀️</div>
                <p class="day-temperature">+25°C</p>
                <p>Солнечно</p>
            </article>
        </div>
    </section>
</main>
<footer class="footer">
    <p>Прогноз погоды</p>
</footer>
</body>
</html>
