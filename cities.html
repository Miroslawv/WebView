<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Города</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <h1>Погода</h1>
  <nav class="nav">
    <a href="index.html">Сегодня</a>
    <a href="forecast.html">Прогноз</a>
    <a href="cities.html">Города</a>
  </nav>
</header>
<main>
  <section class="cities">
    <h2>Погода в городах</h2>
    <div class="city-list">
      <article class="city">
        <h3>Москва</h3>
        <div class="weather-icon">☀️</div>
        <p class="day-temperature">+24°C</p>
        <p>Солнечно</p>
      </article>
      <article class="city">
        <h3>Вашингтон</h3>
        <div class="weather-icon">🌧️</div>
        <p class="day-temperature">+18°C</p>
        <p>Дождь</p>
      </article>
      <article class="city">
        <h3>Токио</h3>
        <div class="weather-icon">🌤️</div>
        <p class="day-temperature">+22°C</p>
        <p>Облачно</p>
      </article>
      <article class="city">
        <h3>Вильнюс</h3>
        <div class="weather-icon">☀️</div>
        <p class="day-temperature">+27°C</p>
        <p>Солнечно</p>
      </article>
    </div>
  </section>
</main>
<footer class="footer">
  <p>Погода в городах</p>
</footer>
